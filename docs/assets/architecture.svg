<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="architecture-title architecture-desc" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif">
  <title id="architecture-title">LIMBO architecture</title>
  <desc id="architecture-desc">Two apps declare ops on one local-first skeleton; the skeleton merges them with named rules and stores them locally; a property kit gates every op and Kiro builds through the kit.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5B4B"/></marker>
    <marker id="arr-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D86"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F2EADB"/>
  <text x="40" y="44" font-family="'Old Standard TT',Georgia,serif" font-size="26" fill="#2A2019">LIMBO: one skeleton, two apps, one gate</text>
  <text x="40" y="68" font-family="'DM Mono',ui-monospace,monospace" font-size="13" fill="#6B5B4B">every op declares its merge rule; the kit refuses ops that diverge</text>

  <!-- skeleton zone -->
  <rect x="40" y="96" width="600" height="424" rx="6" fill="none" stroke="#CDBFA8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="116" font-family="'DM Mono',ui-monospace,monospace" font-size="12" fill="#6B5B4B">skeleton/  (template, 24 files)</text>

  <!-- connectors drawn first -->
  <g fill="none" stroke="#6B5B4B" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M160 200 V232" />
    <path d="M360 200 V232" stroke="#6B5B4B"/>
    <path d="M160 296 V352"/>
    <path d="M360 296 V324 H460 V352"/>
    <path d="M160 416 V448"/>
    <path d="M460 416 V448" stroke-dasharray="5,4"/>
  </g>
  <path d="M700 240 H640" fill="none" stroke="#2F5D86" stroke-width="1.5" marker-end="url(#arr-hot)"/>
  <path d="M780 336 V304" fill="none" stroke="#2F5D86" stroke-width="1.5" marker-end="url(#arr-hot)"/>

  <!-- apps -->
  <rect x="80" y="136" width="160" height="64" rx="6" fill="#E8DDC9" stroke="#2A2019" stroke-width="1.5"/>
  <text x="160" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">BASECAMP</text>
  <text x="160" y="184" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">12 ops, trip list</text>
  <rect x="280" y="136" width="160" height="64" rx="6" fill="#E8DDC9" stroke="#2A2019" stroke-width="1.5"/>
  <text x="360" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">AFTERSHOCK</text>
  <text x="360" y="184" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">6 ops, sector grid</text>

  <!-- core -->
  <rect x="80" y="232" width="360" height="64" rx="6" fill="#F2EADB" stroke="#2A2019" stroke-width="1.5"/>
  <rect x="92" y="240" width="52" height="16" rx="2" fill="none" stroke="#2F6B4F"/>
  <text x="118" y="252" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="10" fill="#2F6B4F">CORE</text>
  <text x="260" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">Op layer + named merges</text>
  <text x="260" y="284" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">causal buffer, 5 rules, simulate()</text>

  <!-- sync + store -->
  <rect x="80" y="352" width="160" height="64" rx="6" fill="#F2EADB" stroke="#2A2019" stroke-width="1.5"/>
  <text x="160" y="380" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">Replica + link</text>
  <text x="160" y="400" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">in-page link, dev relay</text>
  <rect x="380" y="352" width="160" height="64" rx="6" fill="#F2EADB" stroke="#2A2019" stroke-width="1.5"/>
  <text x="460" y="380" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">Limbo layer</text>
  <text x="460" y="400" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">fog, twin, inspector</text>

  <rect x="80" y="448" width="160" height="56" rx="6" fill="#E8DDC9" stroke="#2A2019" stroke-width="1.5"/>
  <text x="160" y="472" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">Local store</text>
  <text x="160" y="490" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">Yjs + IndexedDB</text>
  <rect x="380" y="448" width="160" height="56" rx="6" fill="#E8DDC9" stroke="#2A2019" stroke-width="1.5"/>
  <text x="460" y="472" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">The screen</text>
  <text x="460" y="490" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">what the user sees</text>

  <!-- kit + kiro -->
  <rect x="700" y="208" width="220" height="96" rx="6" fill="#F2EADB" stroke="#2F5D86" stroke-width="2"/>
  <text x="810" y="244" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">kit/ property gate</text>
  <text x="810" y="264" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">10,000 orderings, vacuity,</text>
  <text x="810" y="280" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">mutants, golden histories</text>
  <rect x="700" y="336" width="220" height="96" rx="6" fill="#E8DDC9" stroke="#2F5D86" stroke-width="2"/>
  <text x="810" y="372" text-anchor="middle" font-size="16" font-weight="600" fill="#2A2019">.kiro/ build rig</text>
  <text x="810" y="392" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">steering, 8 hooks, 2 agents,</text>
  <text x="810" y="408" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="11" fill="#6B5B4B">MCP, specs</text>

  <!-- arrow labels on masks -->
  <rect x="654" y="226" width="40" height="16" fill="#F2EADB"/>
  <text x="674" y="238" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="10" fill="#2F5D86">GATES</text>
  <rect x="792" y="312" width="40" height="16" fill="#F2EADB"/>
  <text x="812" y="324" text-anchor="middle" font-family="'DM Mono',ui-monospace,monospace" font-size="10" fill="#2F5D86">RUNS</text>
</svg>
