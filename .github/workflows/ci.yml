name: CI

# Typecheck and lint, the full unit/component/property suite under a 100% coverage gate, and both production builds with
# their budgets. Nothing here needs Kiro, a KIRO_API_KEY, or any secret beyond the default GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc strict, noUncheckedIndexedAccess)
        run: pnpm typecheck
      - name: Op lint (every *.op.ts declares merge and intent, matches the manifest, reads no clock or randomness)
        run: pnpm lint
      - name: "/.kiro is at the root, tracked and never ignored"
        run: pnpm kiro:check
      - name: Gate integrity (kit-owned properties, hooks, agents unchanged)
        run: pnpm gate
      - name: /judge page and JUDGE.md match the committed measurements
        run: node kit/scripts/judge-build.mjs --check

  test:
    name: Tests (unit, component, property; 100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit, component and property tests with 100% coverage thresholds
        # The property suite runs at its CI-sized ordering count here; the full 10,000-ordering tier is committed under evidence/convergence/.
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build both apps (static, offline shell)
        run: pnpm build
      - name: Bundle budget (blocking over 700 KB of JS per app, warning over 500 KB)
        run: node kit/scripts/bundle-budget.mjs
      - name: Landing hero bundle matches its source (site/src/hero.ts)
        run: node kit/scripts/site-hero.mjs --check
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            apps/basecamp/dist
            apps/aftershock/dist
          retention-days: 7
