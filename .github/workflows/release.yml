name: release

# Follows the system recipe: a release is cut from commit messages, but only after the CI/CD Pipeline run for that push to main has
# succeeded (a red main never gets a tag; the landing's version chip reads releases/latest). Nothing deploys from here (deploys are done
# by hand from the Vercel CLI), so a tag never ships code by itself. workflow_dispatch is a manual cut by the owner.
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to push the tag and create the Release

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: we read commits since the last tag
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # tag exactly the commit CI judged

      - name: Compute next version from Angular commits
        id: ver
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            RANGE=""; CUR="0.0.0"
          else
            RANGE="${LAST}..HEAD"; CUR="${LAST#v}"
          fi
          LOG=$(git log --format=%B $RANGE)
          if [ -z "$(echo "$LOG" | tr -d '[:space:]')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BUMP=none
          # here-strings, not `echo | grep -q`: grep -q exits early and pipefail would turn the SIGPIPE into a false negative
          grep -qE '^(feat|fix|perf)(\(.+\))?!:|BREAKING CHANGE:' <<< "$LOG" && BUMP=major
          [ "$BUMP" = none ] && grep -qE '^feat(\(.+\))?:' <<< "$LOG"        && BUMP=minor
          [ "$BUMP" = none ] && grep -qE '^(fix|perf)(\(.+\))?:' <<< "$LOG"  && BUMP=patch
          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${LAST:-the beginning}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          IFS=. read -r MA MI PA <<< "$CUR"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="v${MA}.${MI}.${PA}"
          echo "Bump: $BUMP  ${LAST:-none} -> $NEXT"
          echo "next=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"  >> "$GITHUB_OUTPUT"
          echo "skip=false"  >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.ver.outputs.next }} # passed as data, never spliced into the script
        run: |
          set -euo pipefail
          [[ "$NEXT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "refusing tag '$NEXT'"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" \
            --generate-notes --title "$NEXT"
