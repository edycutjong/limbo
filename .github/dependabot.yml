version: 2
updates:
  # pnpm workspace: one lockfile at the root, a package.json per workspace package.
  - package-ecosystem: "npm"
    directories: ["/", "/skeleton", "/apps/basecamp", "/apps/aftershock", "/kit"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # Major version updates are migrations, not maintenance; they are a deliberate, separate piece of work.
      # (Security updates are not affected by this rule.)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # fast-check stays at 4.10.2: the committed 10,000-ordering run (evidence/convergence/) used it, and
      # .kiro/steering/tech.md names it; a bump could stop `pnpm props:full` reproducing that run.
      - dependency-name: "fast-check"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
